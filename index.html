<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetería UTP</title>
    <link rel="stylesheet" href="css/Style.css">
</head>
<body>

<header class="header">
    <div class="logo">
        <h1>Cafetería UTP</h1>
        <span>Pedidos rápidos</span>
    </div>

    <button class="cart-button" id="cartButton">
        🛒 Carrito <span id="cartCount">0</span>
    </button>
</header>

<main class="container">

    <section class="welcome">
        <h2>¿Qué deseas pedir?</h2>
        <p>Encuentra tus productos favoritos y realiza tu pedido.</p>
    </section>

    <nav class="categories">
        <button class="category active" data-category="todos">Todos</button>
        <button class="category" data-category="comidas">Comidas</button>
        <button class="category" data-category="bebidas">Bebidas</button>
        <button class="category" data-category="snacks">Snacks</button>
    </nav>

    <section class="products" id="productsContainer">
        <!-- Los productos se generan desde JavaScript -->
    </section>

</main>

<!-- Modal del carrito -->
<div class="modal hidden" id="cartModal">

    <div class="modal-content">

        <div class="modal-header">
            <h2>Mi pedido</h2>
            <button id="closeCart">×</button>
        </div>

        <div id="cartItems" class="cart-items">
            <!-- Productos del carrito -->
        </div>

        <div class="cart-footer">
            <div class="total">
                <span>Total</span>
                <strong id="cartTotal">S/ 0.00</strong>
            </div>

            <button class="confirm-button" id="confirmOrder">
                Confirmar pedido
            </button>
        </div>

    </div>

</div>

<!-- Modal de confirmación -->
<div class="modal hidden" id="orderModal">

    <div class="modal-content confirmation">

        <div class="success-icon">✓</div>

        <h2>¡Pedido registrado!</h2>

        <p>Tu pedido <strong>#001</strong> fue registrado correctamente.</p>

        <div class="order-status">
            <div class="status-item completed">
                <span>✓</span>
                <p>Pedido recibido</p>
            </div>

            <div class="status-item current">
                <span>●</span>
                <p>En preparación</p>
            </div>

            <div class="status-item">
                <span>○</span>
                <p>Listo para recoger</p>
            </div>
        </div>

        <button class="confirm-button" id="closeOrder">
            Volver al menú
        </button>

    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
